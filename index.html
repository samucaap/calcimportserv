<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Importacao de Servicos — Calculadora Tributaria</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; min-height: 100vh; }
  input, select, button, textarea { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

// ═══════════════════════════════════════════════════════════
// MODULO TRIBUTARIO
// ═══════════════════════════════════════════════════════════
const TRIB = {
  PIS:    { darf:"5979", alf:0.0165, lei:"Lei 10.865/2004 art. 7, II"                   },
  COFINS: { darf:"5960", alf:0.0760, lei:"Lei 10.865/2004 art. 7, II"                   },
  IOF:    { darf:"4290", alf:0.035,  lei:"Decreto 6.306/2007 e alteracoes"               },
  CIDE:   { darf:"8741", alf:0.1000, lei:"Lei 10.168/2000 arts. 2, 3; SC COSIT 99/2018" },
  ISS:    { darf:"(Guia Municipal)", lei:"LC 116/2003 + Lei Municipal"                  },
  IRRF:   { darf:"0473",            lei:"RIR/2018 art. 744; IN RFB 1.037/2010"          },
};

// ═══════════════════════════════════════════════════════════
// TABELA DE PAISES
// ═══════════════════════════════════════════════════════════
const _FAV = [
  "Andorra","Anguilla","Antigua e Barbuda","Antilhas Holandesas","Aruba","Ilhas Ascensao",
  "Bahamas","Bahrein","Barbados","Belize","Ilhas Bermudas","Brunei","Campione d Italia",
  "Ilhas do Canal","Ilhas Cayman","Chipre","Cingapura","Ilhas Cook","Costa Rica","Djibouti",
  "Dominica","Gibraltar","Granada","Hong Kong","Kiribati","Labuan","Libano","Liberia",
  "Liechtenstein","Macau","Ilha da Madeira","Maldivas","Ilha de Man","Ilhas Marshall",
  "Ilhas Mauricio","Monaco","Ilhas Montserrat","Nauru","Ilha Niue","Ilha Norfolk","Panama",
  "Ilha Pitcairn","Polinesia Francesa","Ilha Queshm","Samoa Americana","Samoa Ocidental",
  "San Marino","Ilhas de Santa Helena","Santa Lucia","Sao Cristovao e Nevis",
  "Ilha de Sao Pedro e Miguelao","Sao Vicente e Granadinas","Seychelles","Ilhas Solomon",
  "St. Kitts e Nevis","Suazilandia (Essuatini)","Sultanato de Oma","Tonga","Tristao da Cunha",
  "Ilhas Turks e Caicos","Vanuatu","Ilhas Virgens Americanas","Ilhas Virgens Britanicas",
];
const _15T = [
  "Suica","Alemanha","Argentina","Austria","Belgica","Canada","Chile","China","Colombia",
  "Coreia do Sul","Dinamarca","Emirados Arabes Unidos","Equador","Espanha","Filipinas",
  "Finlandia","Franca","Hungria","India","Israel","Italia","Japao","Luxemburgo","Mexico",
  "Noruega","Paises Baixos (Holanda)","Paraguai","Peru","Portugal","Republica Tcheca",
  "Russia","Eslovaquia","Africa do Sul","Suecia","Trinidad e Tobago","Turquia","Ucrania",
  "Uruguai","Venezuela",
];
const _15S = ["Estados Unidos","Reino Unido","Australia","Irlanda"];
const PAISES = [
  ..._FAV.map(n=>({n,alf:0.25,fav:true,trat:n==="Cingapura"})),
  ..._15T.map(n=>({n,alf:0.15,fav:false,trat:true})),
  ..._15S.map(n=>({n,alf:0.15,fav:false,trat:false})),
  {n:"Demais paises (regra residual)",alf:0.15,fav:false,trat:false,res:true},
].sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));

// ═══════════════════════════════════════════════════════════
// ENGINE DE CALCULO
// ═══════════════════════════════════════════════════════════
function calcular({valorFX,cotInv,cotIRRF,pais,alfISS,cide,grossUp,parecer2026,alfIRRF}) {
  const brl  = valorFX * cotInv;
  const brlI = valorFX * cotIRRF;
  const pi   = PAISES.find(x=>x.n===pais) || PAISES.find(x=>x.res);
  const alfI = (alfIRRF!=null && !isNaN(+alfIRRF)) ? +alfIRRF : pi.alf;
  const alfIManual = alfIRRF !== null;
  const baseI  = grossUp ? brlI/(1-alfI) : brlI;
  const alfPC  = TRIB.PIS.alf + TRIB.COFINS.alf;
  const basePC = parecer2026 ? baseI : baseI/(1-alfPC);
  const leiPC  = parecer2026
    ? "Lei 10.865/2004 art. 7, II; Parecer SEI/MF 1.129/2026"
    : "Lei 10.865/2004 art. 7, II; IN RFB 2.121/2022 art. 273";
  const r = {
    meta:{brl,brlI,pi,grossUp,baseI,basePC,alfPC,parecer2026,alfI,alfIManual},
    ISS:   {base:brl,   alf:alfISS/100,          val:brl*(alfISS/100),           darf:TRIB.ISS.darf,   lei:TRIB.ISS.lei  },
    PIS:   {base:basePC,alf:TRIB.PIS.alf,         val:basePC*TRIB.PIS.alf,        darf:TRIB.PIS.darf,   lei:leiPC         },
    COFINS:{base:basePC,alf:TRIB.COFINS.alf,      val:basePC*TRIB.COFINS.alf,     darf:TRIB.COFINS.darf,lei:leiPC         },
    IOF:   {base:brl,   alf:TRIB.IOF.alf,         val:brl*TRIB.IOF.alf,           darf:TRIB.IOF.darf,   lei:TRIB.IOF.lei  },
    CIDE:  {base:baseI, alf:cide?TRIB.CIDE.alf:0, val:cide?baseI*TRIB.CIDE.alf:0, darf:TRIB.CIDE.darf,  lei:TRIB.CIDE.lei,ni:!cide},
    IRRF:  {base:baseI, alf:alfI,                  val:baseI*alfI,                  darf:TRIB.IRRF.darf,  lei:TRIB.IRRF.lei },
  };
  r.total = r.ISS.val+r.PIS.val+r.COFINS.val+r.IOF.val+r.CIDE.val+r.IRRF.val;
  r.meta.totalSemIRRF = r.ISS.val+r.PIS.val+r.COFINS.val+r.IOF.val+r.CIDE.val;
  r.meta.cargaTotal   = grossUp ? r.total : r.meta.totalSemIRRF;
  r.meta.cargaPct     = brl>0 ? r.meta.cargaTotal/brl : 0;
  return r;
}

// ═══════════════════════════════════════════════════════════
// FORMATADORES
// ═══════════════════════════════════════════════════════════
const fBRL = v=>(v==null||isNaN(+v))?"--":(+v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fPCT = v=>(v*100).toFixed(2).replace(".",",")+"%";
const fN4  = v=>(+v).toFixed(4).replace(".",",");

// ═══════════════════════════════════════════════════════════
// ESTILOS
// ═══════════════════════════════════════════════════════════
const sInp    = {width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:6,fontSize:13,outline:"none"};
const sSel    = {width:"100%",padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:6,fontSize:13,outline:"none",background:"#fff"};
const sInpErr = {width:"100%",padding:"8px 10px",border:"1px solid #ef4444",borderRadius:6,fontSize:13,outline:"none"};
const sBtn = (bg,ex)=>Object.assign({padding:"9px 16px",background:bg||"#2563eb",color:"#fff",border:"none",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer"},ex||{});

// ═══════════════════════════════════════════════════════════
// COMPONENTES BASE
// ═══════════════════════════════════════════════════════════
function Field({label,hint,err,children}) {
  return (
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:11.5,fontWeight:600,color:"#374151",marginBottom:3}}>{label}</label>
      {children}
      {err  && <span style={{fontSize:11,color:"#ef4444",display:"block",marginTop:2}}>{err}</span>}
      {hint && !err && <span style={{fontSize:10.5,color:"#9ca3af",display:"block",marginTop:2}}>{hint}</span>}
    </div>
  );
}

function Toggle({label,hint,checked,onChange,bold}) {
  return (
    <div style={{marginBottom:4}}>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",userSelect:"none"}} onClick={onChange}>
        <div style={{width:38,height:20,borderRadius:10,background:checked?"#2563eb":"#d1d5db",position:"relative",transition:"background .2s",flexShrink:0}}>
          <div style={{position:"absolute",top:2,left:checked?18:2,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.25)"}}/>
        </div>
        <span style={{fontSize:13,color:"#374151",fontWeight:bold?600:400}}>{label}</span>
      </label>
      {hint && <p style={{margin:"2px 0 0 46px",fontSize:11,color:"#6b7280"}}>{hint}</p>}
    </div>
  );
}

function TRow({nome,base,alf,val,darf,lei,ni,hl}) {
  return (
    <tr style={{background:hl?"#eff6ff":"inherit",opacity:ni?0.5:1}}>
      <td style={{padding:"8px 10px",fontSize:12,fontWeight:hl?700:500,color:hl?"#1d4ed8":"#111"}}>{nome}</td>
      <td style={{padding:"8px 10px",fontSize:12,textAlign:"right"}}>{fBRL(base)}</td>
      <td style={{padding:"8px 10px",fontSize:12,textAlign:"center"}}>{ni?"--":fPCT(alf)}</td>
      <td style={{padding:"8px 10px",fontSize:12,textAlign:"right",fontWeight:600}}>{ni?"Nao incide":fBRL(val)}</td>
      <td style={{padding:"8px 10px",fontSize:11,textAlign:"center",color:"#6b7280",fontFamily:"monospace"}}>{darf}</td>
      <td style={{padding:"8px 10px",fontSize:10,color:"#9ca3af",maxWidth:180,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lei}</td>
    </tr>
  );
}

// ═══════════════════════════════════════════════════════════
// TAB GUIA DE USO
// ═══════════════════════════════════════════════════════════
function TabGuia() {
  const [open,setOpen] = useState(0);
  const toggle = i => setOpen(open===i?null:i);

  const Sec = ({i,cor,num,titulo,subtitulo,children}) => (
    <div style={{border:"1px solid #e5e7eb",borderRadius:10,marginBottom:10,overflow:"hidden"}}>
      <button onClick={()=>toggle(i)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"13px 16px",background:open===i?"#f8fafc":"#fff",border:"none",cursor:"pointer",textAlign:"left"}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:cor,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,flexShrink:0}}>{num}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13,color:"#111"}}>{titulo}</div>
          <div style={{fontSize:11,color:"#9ca3af",marginTop:1}}>{subtitulo}</div>
        </div>
        <span style={{color:"#9ca3af",fontSize:12}}>{open===i?"▲":"▼"}</span>
      </button>
      {open===i && <div style={{padding:"0 20px 20px",borderTop:"1px solid #f0f0f0"}}>{children}</div>}
    </div>
  );

  const T = ({rows,cols}) => (
    <div style={{overflowX:"auto",marginTop:10}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead><tr>{cols.map((c,i)=><th key={i} style={{padding:"8px 10px",background:"#1e3a5f",color:"#fff",fontWeight:600,textAlign:"left",whiteSpace:"nowrap"}}>{c}</th>)}</tr></thead>
        <tbody>{rows.map((r,i)=><tr key={i} style={{background:i%2===0?"#f9fafb":"#fff"}}>{r.map((c,j)=><td key={j} style={{padding:"7px 10px",borderBottom:"1px solid #f0f0f0"}}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );

  const Info = ({children,cor}) => (
    <div style={{background:cor||"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"10px 14px",margin:"10px 0",fontSize:12,lineHeight:1.6}}>{children}</div>
  );

  const H = ({children}) => <p style={{fontWeight:700,fontSize:13,color:"#1e3a5f",margin:"14px 0 6px"}}>{children}</p>;

  return (
    <div style={{maxWidth:820}}>
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#2563eb)",borderRadius:10,padding:"16px 20px",marginBottom:20,color:"#fff"}}>
        <div style={{fontWeight:800,fontSize:16}}>Guia de Uso</div>
        <div style={{fontSize:12,opacity:.85,marginTop:4}}>Referencia rapida para usar a calculadora de importacao de servicos corretamente.</div>
      </div>

      <Sec i={0} cor="#2563eb" num="1" titulo="Passo a passo — como fazer um calculo" subtitulo="Do preenchimento ao PDF em 6 etapas">
        <H>Etapa 1 — Dados da invoice</H>
        <p style={{fontSize:12,lineHeight:1.7}}>Informe o <b>valor</b> da invoice em moeda estrangeira e selecione a <b>moeda</b>. Em seguida, preencha as <b>cotacoes</b>:</p>
        <Info><b>Cotacao invoice</b> — converte o valor para BRL. Base de calculo de ISS, PIS, COFINS, IOF e CIDE.<br/><b>Cotacao IRRF</b> — usada para calcular o IRRF. Por padrao replica a cotacao da invoice, mas pode ser ajustada (ex.: PTAX D-1).</Info>
        <H>Etapa 2 — Pais do prestador e aliquota IRRF</H>
        <p style={{fontSize:12,lineHeight:1.7}}>Selecione o pais do beneficiario. A <b>aliquota de IRRF e preenchida automaticamente</b> (15% paises comuns, 25% paraiso fiscal). O campo "Aliquota IRRF %" pode ser editado manualmente — borda laranja indica override ativo; clique em "Resetar" para voltar ao padrao.</p>
        <H>Etapa 3 — ISS</H>
        <p style={{fontSize:12,lineHeight:1.7}}>Informe a aliquota de ISS do municipio do tomador (entre 2% e 5% conforme LC 116/2003). Consulte o Codigo Tributario Municipal.</p>
        <H>Etapa 4 — Opcoes de calculo</H>
        <T cols={["Opcao","Quando ativar","Efeito"]} rows={[
          ["Parecer 1.129/2026 (padrao ON)","Fatos geradores a partir de 09/06/2026","Base PIS/COFINS = valor antes IRRF (sem fator Z)"],
          ["Incide CIDE","Tecnologia, royalties, assistencia tecnica, know-how","Aplica 10% sobre base IRRF (SC COSIT 99/2018)"],
          ["Gross Up IRRF","Contrato preve que o tomador assume o IRRF","Majora base IRRF: base = valor / (1 - aliq. IRRF)"],
        ]}/>
        <H>Etapas 5 e 6 — Calcular, conferir e exportar</H>
        <p style={{fontSize:12,lineHeight:1.7}}>Clique em <b>"Calcular Tributos"</b>. Confira a <b>carga tributaria %</b> no rodape da tabela. Use <b>"Ver Memoria de Calculo"</b> para conferir formulas e <b>"Salvar PDF"</b> para gerar o documento com fundamentos legais.</p>
      </Sec>

      <Sec i={1} cor="#059669" num="2" titulo="Os 6 tributos — visao geral" subtitulo="Base de calculo, aliquota e fundamento de cada tributo">
        <T cols={["Tributo","Aliq.","Base de calculo","Quem suporta","Fundamento"]} rows={[
          ["ISSQN","Municipal (2-5%)","Valor BRL (cot. invoice)","Tomador (retencao)","LC 116/2003"],
          ["PIS-Importacao","1,65%","Valor antes IRRF (+-fator Z)","Tomador","Lei 10.865/2004"],
          ["COFINS-Importacao","7,60%","Valor antes IRRF (+-fator Z)","Tomador","Lei 10.865/2004"],
          ["IOF-Cambio","3,5%","Valor BRL (cot. invoice)","Tomador","Decreto 6.306/2007"],
          ["CIDE","10%","Valor antes IRRF (= base IRRF)","Tomador","Lei 10.168/2000"],
          ["IRRF","15% ou 25%","Valor antes IRRF (+-gross up)","Retido na fonte","RIR/2018 art. 744"],
        ]}/>
        <Info cor="#f0fdf4"><b>Nota CIDE:</b> incide somente em contratos de royalties, assistencia tecnica, transferencia de tecnologia, servicos de software e know-how. Nao incide em servicos profissionais gerais.</Info>
      </Sec>

      <Sec i={2} cor="#7c3aed" num="3" titulo="Gross Up — o que e e quando usar" subtitulo="Quando o tomador assume o onus do IRRF">
        <p style={{fontSize:12,lineHeight:1.7,marginTop:12}}>Ocorre quando o contrato estabelece que o fornecedor deve receber o valor <b>liquido de impostos</b>. O tomador arca com o IRRF adicionalmente ao valor da invoice.</p>
        <H>Exemplo pratico</H>
        <T cols={["","Sem Gross Up","Com Gross Up"]} rows={[
          ["Invoice","USD 10.000","USD 10.000"],
          ["Cotacao","R$ 5,00","R$ 5,00"],
          ["Valor BRL","R$ 50.000","R$ 50.000"],
          ["Base IRRF","R$ 50.000","R$ 50.000 / (1 - 15%) = R$ 58.824"],
          ["IRRF (15%)","R$ 7.500 (retido do fornecedor)","R$ 8.824 (custo adicional do tomador)"],
          ["Fornecedor recebe","R$ 42.500","R$ 50.000"],
          ["Custo total p/ tomador","R$ 50.000","R$ 58.824"],
        ]}/>
        <Info cor="#fef3c7"><b>Quando usar:</b> ative Gross Up quando o contrato diz "pagamento liquido", "free of taxes", "net of withholding" ou equivalente.</Info>
      </Sec>

      <Sec i={3} cor="#dc2626" num="4" titulo="Carga tributaria — como interpretar o percentual" subtitulo="O que entra e o que fica de fora do calculo">
        <p style={{fontSize:12,lineHeight:1.7,marginTop:12}}>A carga tributaria representa o <b>percentual dos tributos sobre o valor BRL da invoice</b> (valor estrangeiro x cotacao invoice).</p>
        <H>Regra do IRRF</H>
        <T cols={["Situacao","O que entra na carga","Motivo"]} rows={[
          ["Com Gross Up","ISS + PIS + COFINS + IOF + CIDE + IRRF","O tomador arca com todos os tributos, inclusive o IRRF"],
          ["Sem Gross Up","ISS + PIS + COFINS + IOF + CIDE (excluido o IRRF)","O IRRF e retido do fornecedor — nao e custo do tomador"],
        ]}/>
        <Info>Quando sem Gross Up, a calculadora exibe separadamente: <b>carga sem IRRF</b> (custo efetivo do tomador) e o valor do IRRF (obrigacao de retencao, nao saida de caixa adicional).</Info>
      </Sec>

      <Sec i={4} cor="#0891b2" num="5" titulo="Parecer SEI/MF 1.129/2026 — nova regra PIS/COFINS" subtitulo="Mudanca na base de calculo a partir de 09/06/2026">
        <p style={{fontSize:12,lineHeight:1.7,marginTop:12}}>Para fatos geradores a partir de 09/06/2026, o valor das proprias contribuicoes <b>nao integra mais a base de calculo</b>. O calculo "por dentro" (fator Z) deixou de ser aplicavel.</p>
        <T cols={["","Regra antiga (IN 2.121/2022 art. 273)","Regra nova (Parecer 1.129/2026)"]} rows={[
          ["Formula base","Valor antes IRRF / (1 - 9,25%)","Valor antes IRRF"],
          ["Fator Z","Sim — divide por 0,9075","Nao — base direta"],
          ["Vigencia","Fatos geradores ate 08/06/2026","Fatos geradores a partir de 09/06/2026"],
          ["Opcao na calc.","Desligar o toggle Parecer 1.129/2026","Toggle ativado (padrao)"],
        ]}/>
        <Info cor="#f0fdf4"><b>Como usar:</b> o toggle "Seguir Parecer SEI/MF n. 1.129/2026" vem ativado por padrao. Para fatos geradores anteriores a 09/06/2026, desative-o.</Info>
      </Sec>

      <Sec i={5} cor="#b45309" num="6" titulo="Tributacao favorecida — paraísos fiscais" subtitulo="Paises com IRRF de 25% conforme IN RFB 1.037/2010">
        <p style={{fontSize:12,lineHeight:1.7,marginTop:12}}>A IN RFB 1.037/2010 lista os paises com tributacao favorecida. Remessas para esses paises sujeitam-se a IRRF de <b>25%</b>, independentemente de tratado internacional.</p>
        <p style={{fontSize:11,color:"#555",lineHeight:1.8,marginTop:8}}>
          <b>Principais jurisdicoes:</b> Ilhas Cayman · Bahamas · Ilhas Virgens Britanicas · Panama · Liechtenstein · Monaco · Bermudas · Ilhas Marshall · Vanuatu · Seychelles · Andorra · Gibraltar · Hong Kong · Macau · e outros (64 no total).
        </p>
        <Info cor="#fef3c7"><b>Atencao:</b> a calculadora identifica automaticamente e preenche a aliquota IRRF com 25%. O campo fica editavel caso voce precise de ajuste.</Info>
      </Sec>

      <Sec i={6} cor="#4f46e5" num="7" titulo="Cotacoes — invoice vs IRRF" subtitulo="Quando e por que usar cotacoes diferentes">
        <T cols={["Cotacao","Usada para","Quando difere"]} rows={[
          ["Cotacao invoice","ISS · PIS/COFINS · IOF · CIDE","Data de pagamento ou remessa"],
          ["Cotacao IRRF","Base IRRF (e CIDE e PIS/COFINS)","PTAX do dia util anterior, conforme banco ou contrato"],
        ]}/>
        <Info><b>Comportamento padrao:</b> a cotacao IRRF replica automaticamente a cotacao invoice. Edite o campo "Cotacao IRRF" para desvincula-las.</Info>
      </Sec>

      <Sec i={7} cor="#0f766e" num="8" titulo="CIDE — base de calculo e SC COSIT 99/2018" subtitulo="Por que a base CIDE inclui o IRRF">
        <p style={{fontSize:12,lineHeight:1.7,marginTop:12}}>Contra o que parece intuitivo, a base da CIDE <b>inclui o IRRF</b> — e igual a base do IRRF (valor antes da retencao), conforme SC COSIT 99/2018.</p>
        <T cols={["Elemento","Valor errado (sem IRRF)","Valor correto (com IRRF)"]} rows={[
          ["Invoice BRL","R$ 100.000","R$ 100.000"],
          ["IRRF (15%)","—","R$ 15.000"],
          ["Base CIDE","R$ 100.000","R$ 115.000 (= base IRRF)"],
          ["CIDE (10%)","R$ 10.000","R$ 11.500"],
        ]}/>
        <Info cor="#f0fdf4"><b>Fundamento:</b> SC COSIT 99/2018 — "a CIDE incide sobre a importancia liquida paga ao residente no exterior com a adicao do IRRF, independentemente de a fonte pagadora assumir o onus do imposto".</Info>
      </Sec>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// TAB CALCULADORA
// ═══════════════════════════════════════════════════════════
function TabCalc({form,setForm,res,setRes}) {
  const [showMem,setShowMem] = useState(false);
  const [errs,setErrs]       = useState({});

  const set = (k,v) => setForm(f => {
    const n={...f,[k]:v};
    if(k==="cotInv"&&!f._irrfM) n.cotIRRF=v;
    if(k==="pais") n.alfIRRFOverride="";
    return n;
  });

  const validate = () => {
    const e={};
    if(!form.val||isNaN(form.val)||+form.val<=0)          e.val="Informe um valor maior que zero";
    if(!form.cotInv||isNaN(form.cotInv)||+form.cotInv<=0) e.ci ="Cotacao invalida";
    if(+form.alfISS<0||+form.alfISS>10)                   e.iss="Entre 0 e 10%";
    setErrs(e);
    return !Object.keys(e).length;
  };

  const pi = PAISES.find(x=>x.n===form.pais);
  const irrf_manual = form.alfIRRFOverride!=="";
  const alfIRRFEff  = irrf_manual ? +form.alfIRRFOverride/100 : null;
  const alfIRRFDisp = irrf_manual ? form.alfIRRFOverride : (pi?+(pi.alf*100).toFixed(2):"15");

  const onCalc = () => {
    if(!validate()) return;
    setRes(calcular({
      valorFX:+form.val, cotInv:+form.cotInv,
      cotIRRF:+(form.cotIRRF||form.cotInv),
      pais:form.pais, alfISS:+form.alfISS,
      cide:form.cide, grossUp:form.grossUp,
      parecer2026:form.parecer2026,
      alfIRRF:alfIRRFEff,
    }));
    setShowMem(false);
  };

  const gerarPDF = () => {
    if(!res) return;
    const dataStr = new Date().toLocaleDateString("pt-BR");
    const notaPC = res.meta.parecer2026
      ? "Base PIS/COFINS: Parecer SEI/MF 1.129/2026 — valor antes IRRF, fator Z nao aplicavel."
      : "Base PIS/COFINS: IN RFB 2.121/2022 art. 273 — valor antes IRRF acrescido das proprias contribuicoes. Formula: base = valor antes IRRF / (1 - 9,25%).";
    const notaCarga = res.meta.grossUp
      ? `Carga tributaria: ${fPCT(res.meta.cargaPct)} sobre valor BRL da invoice (todos os tributos incluidos).`
      : `Carga tributaria do tomador: ${fPCT(res.meta.cargaPct)} (${fBRL(res.meta.cargaTotal)}). IRRF de ${fBRL(res.IRRF.val)} retido do fornecedor, nao compoe custo do tomador.`;
    const trs = [
      {nome:"ISSQN",r:res.ISS,ni:false,hl:false},
      {nome:"PIS-Importacao",r:res.PIS,ni:false,hl:false},
      {nome:"COFINS-Importacao",r:res.COFINS,ni:false,hl:false},
      {nome:"IOF-Cambio",r:res.IOF,ni:false,hl:false},
      {nome:"CIDE-Tecnologia",r:res.CIDE,ni:res.CIDE.ni,hl:false},
      {nome:"IRRF",r:res.IRRF,ni:false,hl:true},
    ];
    const tribHTML = trs.map(t=>`<tr style="background:${t.hl?"#eff6ff":"white"};opacity:${t.ni?.6:1}">
      <td style="padding:6px 8px;font-size:11px;font-weight:${t.hl?700:500};color:${t.hl?"#1d4ed8":"#111"}">${t.nome}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right">${fBRL(t.r.base)}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:center">${t.ni?"--":fPCT(t.r.alf)}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:right;font-weight:600">${t.ni?"Nao incide":fBRL(t.r.val)}</td>
      <td style="padding:6px 8px;font-size:11px;text-align:center;font-family:monospace;color:#6b7280">${t.r.darf}</td>
      <td style="padding:6px 8px;font-size:10px;color:#9ca3af">${t.r.lei}</td>
    </tr>`).join("");
    const mem=[
      ["Valor da Invoice",form.val+" "+form.moeda],
      ["Cotacao Invoice","R$ "+fN4(form.cotInv)],
      ["Cotacao IRRF","R$ "+fN4(form.cotIRRF||form.cotInv)],
      ["Base BRL (invoice x cot. invoice)",fBRL(res.meta.brl)],
      ["Base BRL IRRF (invoice x cot. IRRF)",fBRL(res.meta.brlI)],
      ["Aliquota IRRF aplicada",fPCT(res.meta.alfI)+(res.meta.alfIManual?" (ajustada manualmente)":" (padrao do pais)")],
      ["Base IRRF / valor antes retencao",res.meta.grossUp?fBRL(res.meta.brlI)+" / (1 - "+fPCT(res.meta.alfI)+") = "+fBRL(res.meta.baseI):fBRL(res.meta.baseI)+" (sem gross up)"],
      ["Regra base PIS/COFINS",res.meta.parecer2026?"Parecer SEI/MF 1.129/2026 (sem fator Z)":"IN 2.121/2022 art. 273 (com fator Z)"],
      ["Base PIS/COFINS",res.meta.parecer2026?fBRL(res.meta.basePC)+" [= valor antes IRRF]":fBRL(res.meta.basePC)+" [= "+fBRL(res.meta.baseI)+" / 0,9075]"],
      ["Pais / Aliquota IRRF",res.meta.pi.n+" -- "+fPCT(res.meta.pi.alf)],
      ["Tributacao favorecida",res.meta.pi.fav?"Sim (IN RFB 1.037/2010)":"Nao"],
      ["sep"],
      ["ISSQN",fBRL(res.ISS.base)+" x "+fPCT(res.ISS.alf)+" = "+fBRL(res.ISS.val)],
      ["PIS",fBRL(res.PIS.base)+" x "+fPCT(TRIB.PIS.alf)+" = "+fBRL(res.PIS.val)],
      ["COFINS",fBRL(res.COFINS.base)+" x "+fPCT(TRIB.COFINS.alf)+" = "+fBRL(res.COFINS.val)],
      ["IOF",fBRL(res.IOF.base)+" x "+fPCT(TRIB.IOF.alf)+" = "+fBRL(res.IOF.val)],
      ["CIDE",res.CIDE.ni?"Nao incide":fBRL(res.CIDE.base)+" x "+fPCT(TRIB.CIDE.alf)+" = "+fBRL(res.CIDE.val)+" [base IRRF — SC COSIT 99/2018]"],
      ["IRRF",fBRL(res.IRRF.base)+" x "+fPCT(res.IRRF.alf)+" = "+fBRL(res.IRRF.val)],
      ["sep"],
      ["Total de Tributos",fBRL(res.total)],
      [res.meta.grossUp?"Carga tributaria (todos os tributos)":"Carga tributaria do tomador (sem IRRF)",
        fPCT(res.meta.cargaPct)+" ["+fBRL(res.meta.cargaTotal)+" / "+fBRL(res.meta.brl)+"]"],
      ...(res.meta.grossUp?[]:[["IRRF retido do fornecedor (nao e custo do tomador)",fBRL(res.IRRF.val)]]),
    ];
    const nc=res.meta.parecer2026?"#166534":"#1d4ed8";
    const nb=res.meta.parecer2026?"#f0fdf4":"#eff6ff";
    const memHTML=mem.map(it=>{
      if(it[0]==="sep") return `<tr><td colspan="2" style="border-top:2px solid #e5e7eb;padding:0;height:3px;"></td></tr>`;
      const isTot=it[0]==="Total de Tributos", isCarga=it[0].startsWith("Carga");
      return `<tr style="background:${isTot||isCarga?"#eff6ff":"white"}">
        <td style="padding:5px 8px;font-size:11px;color:#6b7280;font-weight:${isTot||isCarga?700:400};width:45%">${it[0]}</td>
        <td style="padding:5px 8px;font-size:11px;font-family:monospace;font-weight:${isTot||isCarga?700:400};color:${isTot||isCarga?"#1d4ed8":"#111"}">${it[1]||""}</td>
      </tr>`;
    }).join("");
    const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Calculo Importacao Servicos</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;color:#111;font-size:12px;}
h1{margin:0 0 2px;font-size:17px;color:#1e3a5f;font-weight:800;}
h2{margin:18px 0 6px;font-size:12px;color:#1e3a5f;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #1e3a5f;padding-bottom:3px;}
table{width:100%;border-collapse:collapse;margin-bottom:6px;}
th{background:#1e3a5f;color:#fff;padding:6px 8px;font-size:10px;font-weight:600;text-align:left;}
tbody tr:nth-child(even){background:#f9fafb;}
.info{display:flex;flex-wrap:wrap;gap:10px 18px;margin:8px 0 12px;padding:8px 12px;background:#eff6ff;border-radius:5px;font-size:10px;}
.notepc{font-size:9.5px;padding:5px 10px;border-left:3px solid ${res.meta.parecer2026?"#22c55e":"#3b82f6"};margin:6px 0;line-height:1.5;color:${nc};background:${nb};}
.notecarga{font-size:9.5px;padding:5px 10px;border-left:3px solid #f59e0b;margin:6px 0;line-height:1.5;color:#92400e;background:#fef3c7;}
.foot{margin-top:20px;font-size:8.5px;color:#9ca3af;border-top:1px solid #e5e7eb;padding-top:6px;}
@media print{body{padding:0;}@page{margin:1.5cm;size:A4;}}</style></head><body>
<h1>Importacao de Servicos -- Calculo Tributario</h1>
<div style="font-size:9px;color:#9ca3af;margin-bottom:4px;">Gerado em ${dataStr}</div>
<div class="info">
${form.desc?`<span><b>Ref.:</b> ${form.desc}</span>`:""}
<span><b>Invoice:</b> ${form.val} ${form.moeda}</span>
<span><b>Cot. Invoice:</b> R$ ${fN4(form.cotInv)}</span>
<span><b>Cot. IRRF:</b> R$ ${fN4(form.cotIRRF||form.cotInv)}</span>
<span><b>Base BRL:</b> ${fBRL(res.meta.brl)}</span>
<span><b>Pais:</b> ${form.pais}</span>
<span><b>Aliq. IRRF:</b> ${fPCT(res.meta.alfI)}${res.meta.alfIManual?" (manual)":""}</span>
${res.meta.pi.fav?`<span style="color:#b45309;font-weight:700">Trib. Favorecida 25%</span>`:""}
${res.meta.grossUp?`<span style="color:#6b21a8;font-weight:700">Gross Up IRRF</span>`:""}
<span style="color:${nc};font-weight:700">${res.meta.parecer2026?"Parecer SEI/MF 1.129/2026":"IN 2.121/2022 art. 273"}</span>
</div>
<h2>Tributos Apurados</h2>
<table><thead><tr>
<th>Tributo</th><th style="text-align:right">Base de Calculo</th><th style="text-align:center">Aliquota</th>
<th style="text-align:right">Valor Devido</th><th style="text-align:center">DARF</th><th>Base Legal</th>
</tr></thead><tbody>${tribHTML}</tbody>
<tfoot><tr style="background:#f0f9ff;border-top:2px solid #2563eb;">
<td colspan="3" style="padding:7px 8px;font-weight:700;font-size:12px;">Total de Tributos</td>
<td style="padding:7px 8px;font-weight:800;font-size:14px;text-align:right;color:#1d4ed8;">${fBRL(res.total)}${!res.meta.grossUp?`<div style="font-size:10px;color:#6b7280;font-weight:400">Custo tomador: ${fBRL(res.meta.cargaTotal)}</div>`:""}</td>
<td colspan="2" style="padding:7px 8px;">
<div style="font-weight:700;font-size:13px;color:#1d4ed8;">${fPCT(res.meta.cargaPct)} da base BRL</div>
${!res.meta.grossUp?`<div style="font-size:9.5px;color:#b45309;margin-top:2px;">IRRF de ${fBRL(res.IRRF.val)} retido do fornecedor</div>`:""}
</td></tr></tfoot></table>
<div class="notepc">${notaPC}</div>
<div class="notecarga">${notaCarga}</div>
<h2>Memoria de Calculo</h2>
<table><thead><tr><th style="width:45%">Descricao</th><th>Valor / Formula</th></tr></thead>
<tbody>${memHTML}</tbody></table>
<div class="foot">Ferramenta auxiliar — consulte um contador ou advogado tributarista para casos especificos. | PIS 1,65% / COFINS 7,60% / IOF 3,5% / CIDE 10% / IRRF conforme pais.</div>
</body></html>`;
    const w=window.open("","_blank");
    if(w){w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),600);}
  };

  return (
    <div style={{display:"grid",gridTemplateColumns:"minmax(280px,395px) 1fr",gap:20,alignItems:"start"}}>
      <div style={{background:"#f9fafb",borderRadius:10,padding:18,border:"1px solid #e5e7eb"}}>
        <p style={{margin:"0 0 14px",fontWeight:700,fontSize:14,color:"#111"}}>Dados da Invoice</p>
        <Field label="Descricao / Referencia">
          <input style={sInp} value={form.desc} onChange={e=>set("desc",e.target.value)} placeholder="Opcional"/>
        </Field>
        <div style={{display:"grid",gridTemplateColumns:"80px 1fr",gap:8}}>
          <Field label="Moeda">
            <select style={sSel} value={form.moeda} onChange={e=>set("moeda",e.target.value)}>
              {["USD","EUR","GBP","CHF","JPY","CAD","AUD","ARS","MXN","CNY","Outra"].map(m=><option key={m}>{m}</option>)}
            </select>
          </Field>
          <Field label={`Valor (${form.moeda})`} err={errs.val}>
            <input style={errs.val?sInpErr:sInp} type="number" min="0" step="0.01" value={form.val} onChange={e=>set("val",e.target.value)} placeholder="10.000,00"/>
          </Field>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <Field label="Cotacao Invoice (R$)" hint="Base ISS, PIS, COFINS, IOF, CIDE" err={errs.ci}>
            <input style={errs.ci?sInpErr:sInp} type="number" min="0" step="0.0001" value={form.cotInv} onChange={e=>set("cotInv",e.target.value)} placeholder="5,2000"/>
          </Field>
          <Field label="Cotacao IRRF (R$)" hint="Padrao = cotacao invoice">
            <input style={sInp} type="number" min="0" step="0.0001" value={form.cotIRRF} placeholder={form.cotInv||"5,2000"}
              onChange={e=>setForm(f=>({...f,cotIRRF:e.target.value,_irrfM:true}))}/>
          </Field>
        </div>
        <Field label="Pais do Beneficiario / Prestador">
          <select style={sSel} value={form.pais} onChange={e=>set("pais",e.target.value)}>
            {PAISES.map(x=><option key={x.n} value={x.n}>{x.n}{x.fav?" -- 25% (trib. favorecida)":" -- 15%"}{x.trat?" / tratado":""}</option>)}
          </select>
          {pi?.fav && <p style={{margin:"4px 0 0",fontSize:11,color:"#b45309",fontWeight:500}}>Atencao: pais com tributacao favorecida — IRRF 25%</p>}
          {!pi?.fav && pi?.trat && <p style={{margin:"4px 0 0",fontSize:11,color:"#059669",fontWeight:500}}>Tratado para evitar dupla tributacao em vigor</p>}
        </Field>
        <Field label="Aliquota IRRF %"
          hint={irrf_manual?"Ajustada manualmente — clique em Resetar para voltar ao padrao":"Preenchida automaticamente pelo pais selecionado"}>
          <div style={{display:"flex",gap:6,alignItems:"stretch"}}>
            <input type="number" min="0" max="100" step="0.5"
              style={{...sInp,flex:1,border:irrf_manual?"1px solid #f59e0b":"1px solid #d1d5db",background:irrf_manual?"#fffbeb":"#fff"}}
              value={alfIRRFDisp}
              onChange={e=>set("alfIRRFOverride",e.target.value)}/>
            {irrf_manual && (
              <button onClick={()=>set("alfIRRFOverride","")}
                style={{padding:"0 10px",background:"#fef3c7",border:"1px solid #f59e0b",borderRadius:6,fontSize:11,cursor:"pointer",color:"#92400e",fontWeight:600,whiteSpace:"nowrap"}}>
                Resetar
              </button>
            )}
          </div>
          {irrf_manual && <span style={{fontSize:10.5,color:"#b45309",marginTop:3,display:"block",fontWeight:500}}>Padrao do pais: {pi?fPCT(pi.alf):"15%"}</span>}
        </Field>
        <div style={{display:"grid",gridTemplateColumns:"130px 1fr",gap:8,marginBottom:4}}>
          <Field label="Aliquota ISS %" hint="Verificar lei municipal" err={errs.iss}>
            <input style={errs.iss?sInpErr:sInp} type="number" min="0" max="10" step="0.5" value={form.alfISS} onChange={e=>set("alfISS",e.target.value)}/>
          </Field>
        </div>
        <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,padding:"10px 12px",marginBottom:12}}>
          <p style={{margin:"0 0 8px",fontSize:11,fontWeight:700,color:"#374151",textTransform:"uppercase",letterSpacing:.4}}>Opcoes de Calculo</p>
          <div style={{marginBottom:10,paddingBottom:10,borderBottom:"1px solid #f0f0f0"}}>
            <Toggle label="Seguir Parecer SEI/MF n. 1.129/2026" bold={true}
              checked={form.parecer2026} onChange={()=>set("parecer2026",!form.parecer2026)}
              hint={form.parecer2026?"Fatos >= 09/06/2026: base PIS/COFINS = valor antes IRRF (sem fator Z)":"Fatos < 09/06/2026: base inclui proprias contribuicoes (IN 2.121/2022 art. 273)"}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <Toggle label="Incide CIDE? (tecnologia, royalties, assist. tecnica)" checked={form.cide} onChange={()=>set("cide",!form.cide)}/>
            <Toggle label="Aplicar Gross Up no IRRF?" checked={form.grossUp} onChange={()=>set("grossUp",!form.grossUp)}
              hint={form.grossUp&&pi?`Base IRRF = valor BRL / (1 - ${fPCT(+alfIRRFDisp/100)}) — tomador assume o imposto`:"Quando o tomador assume o onus do IRRF"}/>
          </div>
        </div>
        <button onClick={onCalc} style={sBtn("#2563eb",{width:"100%",padding:11,fontSize:14})}>Calcular Tributos</button>
      </div>

      {res ? (
        <div>
          <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"9px 14px",marginBottom:10,fontSize:12,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            {form.desc && <b>{form.desc}</b>}
            <span>Base BRL: <b>{fBRL(res.meta.brl)}</b></span>
            <span><b>{form.pais}</b></span>
            <span>IRRF: <b>{fPCT(res.meta.alfI)}</b>{res.meta.alfIManual&&<span style={{color:"#b45309"}}> *</span>}</span>
            {res.meta.pi.fav && <span style={{background:"#fef3c7",padding:"2px 8px",borderRadius:4,color:"#92400e",fontWeight:600}}>Trib. Favorecida</span>}
            {res.meta.grossUp && <span style={{background:"#f3e8ff",padding:"2px 8px",borderRadius:4,color:"#6b21a8",fontWeight:600}}>Gross Up</span>}
            {res.meta.parecer2026
              ? <span style={{background:"#dcfce7",padding:"2px 8px",borderRadius:4,color:"#166534",fontWeight:600}}>Parecer 1.129/2026</span>
              : <span style={{background:"#dbeafe",padding:"2px 8px",borderRadius:4,color:"#1d4ed8",fontWeight:600}}>IN 2.121/2022 art. 273</span>}
          </div>
          <div style={{background:"#fff",borderRadius:10,border:"1px solid #e5e7eb",overflow:"hidden"}}>
            <div style={{background:"#1e3a5f",color:"#fff",padding:"10px 14px",display:"flex",justifyContent:"space-between"}}>
              <b style={{fontSize:13}}>Calculo dos Tributos</b>
              <span style={{fontSize:11,opacity:.8}}>{new Date().toLocaleDateString("pt-BR")}</span>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}>
                <thead>
                  <tr style={{background:"#f8fafc"}}>
                    {["Tributo","Base de Calculo","Aliquota","Valor Devido","DARF","Base Legal"].map(h=>(
                      <th key={h} style={{padding:"7px 10px",fontSize:11,fontWeight:600,color:"#6b7280",borderBottom:"1px solid #e5e7eb",whiteSpace:"nowrap",
                        textAlign:["Base de Calculo","Valor Devido"].includes(h)?"right":["Aliquota","DARF"].includes(h)?"center":"left"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  <TRow nome="ISSQN"             base={res.ISS.base}    alf={res.ISS.alf}    val={res.ISS.val}    darf={res.ISS.darf}    lei={res.ISS.lei}            />
                  <TRow nome="PIS-Importacao"    base={res.PIS.base}    alf={res.PIS.alf}    val={res.PIS.val}    darf={res.PIS.darf}    lei={res.PIS.lei}            />
                  <TRow nome="COFINS-Importacao" base={res.COFINS.base} alf={res.COFINS.alf} val={res.COFINS.val} darf={res.COFINS.darf} lei={res.COFINS.lei}         />
                  <TRow nome="IOF-Cambio"        base={res.IOF.base}    alf={res.IOF.alf}    val={res.IOF.val}    darf={res.IOF.darf}    lei={res.IOF.lei}            />
                  <TRow nome="CIDE-Tecnologia"   base={res.CIDE.base}   alf={res.CIDE.alf}   val={res.CIDE.val}   darf={res.CIDE.darf}   lei={res.CIDE.lei} ni={res.CIDE.ni}/>
                  <TRow nome="IRRF"              base={res.IRRF.base}   alf={res.IRRF.alf}   val={res.IRRF.val}   darf={res.IRRF.darf}   lei={res.IRRF.lei} hl={true}  />
                </tbody>
                <tfoot>
                  <tr style={{background:"#f0f9ff",borderTop:"2px solid #2563eb"}}>
                    <td colSpan={3} style={{padding:"10px",fontWeight:700,fontSize:13}}>Total de Tributos</td>
                    <td style={{padding:"10px",textAlign:"right"}}>
                      <div style={{fontWeight:800,fontSize:15,color:"#1d4ed8"}}>{fBRL(res.total)}</div>
                      {!res.meta.grossUp && <div style={{fontSize:10.5,color:"#6b7280",marginTop:1}}>Custo tomador: {fBRL(res.meta.cargaTotal)}</div>}
                    </td>
                    <td colSpan={2} style={{padding:"10px"}}>
                      <div style={{fontWeight:700,fontSize:14,color:"#1d4ed8"}}>{fPCT(res.meta.cargaPct)} da base BRL</div>
                      {!res.meta.grossUp && <div style={{fontSize:10.5,color:"#b45309",marginTop:3}}>IRRF ({fBRL(res.IRRF.val)}) retido do fornecedor — nao compoe custo do tomador</div>}
                    </td>
                  </tr>
                </tfoot>
              </table>
            </div>
            <div style={{padding:"8px 14px",borderTop:"1px solid #e5e7eb",fontSize:10.5,background:res.meta.parecer2026?"#f0fdf4":"#eff6ff",color:res.meta.parecer2026?"#166534":"#1d4ed8"}}>
              {res.meta.parecer2026
                ? "Base PIS/COFINS: Parecer SEI/MF n. 1.129/2026 — fatos a partir de 09/06/2026, fator Z nao aplicavel. Base = valor antes retencao IRRF."
                : "Base PIS/COFINS: IN RFB 2.121/2022 art. 273 — valor antes IRRF acrescido das proprias contribuicoes. Formula: base = valor antes IRRF / (1 - 9,25%)."}
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button onClick={()=>setShowMem(v=>!v)} style={{flex:1,padding:8,background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:7,fontSize:12,cursor:"pointer",color:"#374151"}}>
              {showMem?"Ocultar":"Ver"} Memoria de Calculo
            </button>
            <button onClick={gerarPDF} style={{padding:"8px 18px",background:"#dc2626",border:"none",borderRadius:7,fontSize:12,fontWeight:700,cursor:"pointer",color:"#fff",whiteSpace:"nowrap"}}>
              Salvar PDF
            </button>
          </div>
          {showMem && (
            <div style={{marginTop:6,background:"#fafafa",border:"1px solid #e5e7eb",borderRadius:8,padding:14,fontSize:11}}>
              <p style={{margin:"0 0 10px",fontWeight:700,fontSize:12}}>Memoria Detalhada</p>
              {[
                ["Valor da Invoice",form.val+" "+form.moeda],
                ["Cotacao Invoice","R$ "+fN4(form.cotInv)],
                ["Cotacao IRRF","R$ "+fN4(form.cotIRRF||form.cotInv)],
                ["Base BRL (invoice x cot. invoice)",fBRL(res.meta.brl)],
                ["Base BRL IRRF (invoice x cot. IRRF)",fBRL(res.meta.brlI)],
                ["Aliquota IRRF aplicada",fPCT(res.meta.alfI)+(res.meta.alfIManual?" (ajustada manualmente)":" (padrao do pais)")],
                ["Base IRRF / valor antes retencao",res.meta.grossUp?fBRL(res.meta.brlI)+" / (1 - "+fPCT(res.meta.alfI)+") = "+fBRL(res.meta.baseI):fBRL(res.meta.baseI)+"  (sem gross up)"],
                ["Regra base PIS/COFINS",res.meta.parecer2026?"Parecer SEI/MF 1.129/2026 (sem fator Z)":"IN 2.121/2022 art. 273 (com fator Z)"],
                ["Base PIS/COFINS",res.meta.parecer2026?fBRL(res.meta.basePC)+"  [= valor antes IRRF]":fBRL(res.meta.basePC)+"  [= "+fBRL(res.meta.baseI)+" / 0,9075]"],
                ["Pais / Aliquota IRRF",res.meta.pi.n+" -- "+fPCT(res.meta.pi.alf)],
                ["Tributacao favorecida",res.meta.pi.fav?"Sim (IN RFB 1.037/2010)":"Nao"],
                ["Tratado internacional",res.meta.pi.trat?"Sim -- em vigor":"Nao aplicavel"],
                ["sep"],
                ["ISSQN",fBRL(res.ISS.base)+" x "+fPCT(res.ISS.alf)+" = "+fBRL(res.ISS.val)],
                ["PIS",fBRL(res.PIS.base)+" x "+fPCT(TRIB.PIS.alf)+" = "+fBRL(res.PIS.val)],
                ["COFINS",fBRL(res.COFINS.base)+" x "+fPCT(TRIB.COFINS.alf)+" = "+fBRL(res.COFINS.val)],
                ["IOF",fBRL(res.IOF.base)+" x "+fPCT(TRIB.IOF.alf)+" = "+fBRL(res.IOF.val)],
                ["CIDE",res.CIDE.ni?"Nao incide":fBRL(res.CIDE.base)+" x "+fPCT(TRIB.CIDE.alf)+" = "+fBRL(res.CIDE.val)+" [base IRRF — SC COSIT 99/2018]"],
                ["IRRF",fBRL(res.IRRF.base)+" x "+fPCT(res.IRRF.alf)+" = "+fBRL(res.IRRF.val)],
                ["sep"],
                ["Total de Tributos",fBRL(res.total)],
                [res.meta.grossUp?"Carga tributaria (todos os tributos)":"Carga tributaria do tomador (sem IRRF)",
                  fPCT(res.meta.cargaPct)+"  ["+fBRL(res.meta.cargaTotal)+" / "+fBRL(res.meta.brl)+"]"],
                ...(res.meta.grossUp?[]:[["IRRF retido do fornecedor (nao e custo do tomador)",fBRL(res.IRRF.val)]]),
              ].map((item,i) => {
                if(item[0]==="sep") return <div key={i} style={{borderTop:"1px solid #e5e7eb",margin:"4px 0"}}/>;
                const isTot=item[0]==="Total de Tributos", isCarga=item[0].startsWith("Carga");
                return (
                  <div key={i} style={{display:"flex",gap:12,padding:"5px 6px",borderBottom:"1px solid #f0f0f0",background:isTot||isCarga?"#eff6ff":"transparent"}}>
                    <span style={{color:"#6b7280",minWidth:"44%",fontWeight:isTot||isCarga?700:400}}>{item[0]}</span>
                    <span style={{color:"#111",fontFamily:"monospace",fontWeight:isTot||isCarga?700:400}}>{item[1]}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      ) : (
        <div style={{border:"2px dashed #e5e7eb",borderRadius:10,padding:60,textAlign:"center",color:"#9ca3af",background:"#f9fafb"}}>
          <div style={{fontSize:48,marginBottom:10}}>&#x1F9EE;</div>
          <p style={{margin:0,fontSize:14,fontWeight:500}}>Preencha os dados da invoice e clique em <b style={{color:"#374151"}}>Calcular Tributos</b></p>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// TAB LOTE
// ═══════════════════════════════════════════════════════════
function TabLote() {
  const [rows,setRows]=useState([]);
  const [erro,setErro]=useState("");
  const fRef=useRef();

  const dlModelo=()=>{
    const ws=XLSX.utils.json_to_sheet([
      {"Descricao":"Servico de TI","Moeda":"USD","Valor Invoice":10000,"Cotacao Invoice":5.20,"Cotacao IRRF":5.20,"Pais":"Estados Unidos","Aliquota ISS %":2,"Aliquota IRRF %":"","Incide CIDE":"Nao","Gross Up":"Nao","Parecer 1129/2026":"Sim"},
      {"Descricao":"Consultoria","Moeda":"EUR","Valor Invoice":5000,"Cotacao Invoice":5.65,"Cotacao IRRF":5.65,"Pais":"Alemanha","Aliquota ISS %":3,"Aliquota IRRF %":"","Incide CIDE":"Sim","Gross Up":"Sim","Parecer 1129/2026":"Sim"},
      {"Descricao":"Royalties pre-2026","Moeda":"USD","Valor Invoice":20000,"Cotacao Invoice":5.10,"Cotacao IRRF":5.10,"Pais":"Ilhas Cayman","Aliquota ISS %":2,"Aliquota IRRF %":"","Incide CIDE":"Sim","Gross Up":"Nao","Parecer 1129/2026":"Nao"},
    ]);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Modelo"); XLSX.writeFile(wb,"modelo_importacao_servicos.xlsx");
  };

  const importar=e=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"binary"});
        const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        setRows(data.map((row,i)=>{
          try{
            const ci=+(row["Cotacao Invoice"]||row["Cotação Invoice"]||0);
            const p26raw=String(row["Parecer 1129/2026"]||row["Parecer 1.129/2026"]||"sim");
            const alfIRRFRaw=row["Aliquota IRRF %"]!=null&&row["Aliquota IRRF %"]!==""?+row["Aliquota IRRF %"]/100:null;
            const p={
              valorFX:+(row["Valor Invoice"]||0), cotInv:ci,
              cotIRRF:+(row["Cotacao IRRF"]||row["Cotação IRRF"]||ci),
              pais:String(row["Pais"]||row["País"]||"Demais paises (regra residual)"),
              alfISS:+(row["Aliquota ISS %"]||row["Alíquota ISS %"]||2),
              cide:String(row["Incide CIDE"]||"").toLowerCase().startsWith("s"),
              grossUp:String(row["Gross Up"]||"").toLowerCase().startsWith("s"),
              parecer2026:!p26raw.toLowerCase().startsWith("n"),
              alfIRRF:alfIRRFRaw,
            };
            if(!p.valorFX||!p.cotInv) throw new Error("Valor Invoice e Cotacao Invoice sao obrigatorios");
            const r=calcular(p);
            return {desc:String(row["Descricao"]||row["Descrição"]||""),pais:p.pais,p26:p.parecer2026,_ok:true,_r:r,_i:i+1};
          }catch(ex){return {desc:String(row["Descricao"]||row["Descrição"]||""),_ok:false,_err:ex.message,_i:i+1};}
        }));
        setErro("");
      }catch{setErro("Nao foi possivel ler o arquivo. Use o modelo fornecido.");}
    };
    rd.readAsBinaryString(file); e.target.value="";
  };

  const exportar=()=>{
    const ws=XLSX.utils.json_to_sheet(rows.filter(r=>r._ok).map(r=>({
      "Descricao":r.desc,"Pais":r.pais,"Parecer 1129/2026":r.p26?"Sim":"Nao",
      "Valor BRL":+r._r.meta.brl.toFixed(2),"ISSQN":+r._r.ISS.val.toFixed(2),
      "PIS":+r._r.PIS.val.toFixed(2),"COFINS":+r._r.COFINS.val.toFixed(2),
      "IOF":+r._r.IOF.val.toFixed(2),"CIDE":+r._r.CIDE.val.toFixed(2),
      "IRRF":+r._r.IRRF.val.toFixed(2),"Total Tributos":+r._r.total.toFixed(2),
      "Carga %":fPCT(r._r.meta.cargaPct),"Aliq. IRRF":fPCT(r._r.meta.alfI),
      "Trib. Favorecida":r._r.meta.pi.fav?"Sim":"Nao",
    })));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Resultados"); XLSX.writeFile(wb,"resultados_importacao_servicos.xlsx");
  };

  const ok=rows.filter(r=>r._ok);
  const T=ok.reduce((a,r)=>({
    brl:a.brl+r._r.meta.brl,iss:a.iss+r._r.ISS.val,pis:a.pis+r._r.PIS.val,
    cof:a.cof+r._r.COFINS.val,iof:a.iof+r._r.IOF.val,cide:a.cide+r._r.CIDE.val,
    irrf:a.irrf+r._r.IRRF.val,tot:a.tot+r._r.total,carga:a.carga+r._r.meta.cargaTotal,
  }),{brl:0,iss:0,pis:0,cof:0,iof:0,cide:0,irrf:0,tot:0,carga:0});

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <button onClick={dlModelo} style={sBtn("#059669")}>Baixar Modelo Excel</button>
        <button onClick={()=>fRef.current.click()} style={sBtn("#2563eb")}>Importar Planilha</button>
        {ok.length>0 && <button onClick={exportar} style={sBtn("#7c3aed")}>Exportar Excel</button>}
        <input ref={fRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={importar}/>
      </div>
      {erro && <div style={{padding:"10px 14px",background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:6,color:"#991b1b",fontSize:13,marginBottom:10}}>{erro}</div>}
      {rows.length===0 ? (
        <div style={{border:"2px dashed #e5e7eb",borderRadius:10,padding:40,textAlign:"center",color:"#9ca3af",background:"#f9fafb"}}>
          <div style={{fontSize:36,marginBottom:8}}>&#x1F4CB;</div>
          <p style={{margin:"0 0 8px",fontWeight:600,fontSize:14,color:"#374151"}}>Processamento em Lote</p>
          <p style={{margin:"0 0 12px",fontSize:13}}>1. Baixe o modelo &nbsp; 2. Preencha suas invoices &nbsp; 3. Importe</p>
          <div style={{display:"inline-block",background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,padding:"8px 14px",textAlign:"left",fontSize:11,color:"#555"}}>
            <b>Obrigatorias:</b> Valor Invoice, Cotacao Invoice, Pais<br/>
            <b>Opcionais:</b> Descricao, Cotacao IRRF, Aliquota ISS %, Aliquota IRRF %, Incide CIDE, Gross Up, Parecer 1129/2026
          </div>
        </div>
      ) : (
        <div style={{background:"#fff",borderRadius:10,border:"1px solid #e5e7eb",overflow:"hidden"}}>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:940}}>
              <thead>
                <tr style={{background:"#1e3a5f",color:"#fff"}}>
                  {["#","Descricao","Pais","Regra","Base BRL","ISS","PIS","COFINS","IOF","CIDE","IRRF","Total","Carga %",""].map(h=>(
                    <th key={h} style={{padding:"8px",fontWeight:600,whiteSpace:"nowrap",textAlign:["Descricao","Pais","Regra",""].includes(h)?"left":"right"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map(row=>(
                  <tr key={row._i} style={{borderBottom:"1px solid #f0f0f0",background:row._i%2===0?"#f9fafb":"#fff"}}>
                    <td style={{padding:"6px 8px",textAlign:"right",color:"#9ca3af"}}>{row._i}</td>
                    <td style={{padding:"6px 8px",maxWidth:90,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.desc||"--"}</td>
                    {row._ok ? (
                      <React.Fragment>
                        <td style={{padding:"6px 8px",fontSize:10,color:"#555",maxWidth:80,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.pais}{row._r.meta.pi.fav?" (!)":""}</td>
                        <td style={{padding:"6px 8px"}}><span style={{background:row.p26?"#dcfce7":"#dbeafe",color:row.p26?"#166534":"#1d4ed8",padding:"1px 5px",borderRadius:4,fontWeight:600,fontSize:10}}>{row.p26?"P.1129":"2.121"}</span></td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{fBRL(row._r.meta.brl)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{fBRL(row._r.ISS.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{fBRL(row._r.PIS.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{fBRL(row._r.COFINS.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{fBRL(row._r.IOF.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right"}}>{row._r.CIDE.ni?"--":fBRL(row._r.CIDE.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",fontWeight:600}}>{fBRL(row._r.IRRF.val)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",fontWeight:700,color:"#1d4ed8"}}>{fBRL(row._r.total)}</td>
                        <td style={{padding:"6px 8px",textAlign:"right",color:"#059669",fontWeight:600}}>{fPCT(row._r.meta.cargaPct)}</td>
                        <td style={{padding:"6px 8px"}}><span style={{background:"#d1fae5",color:"#065f46",padding:"2px 6px",borderRadius:8,fontSize:10,fontWeight:600}}>OK</span></td>
                      </React.Fragment>
                    ) : (
                      <td colSpan={12} style={{padding:"6px 8px",color:"#ef4444"}}>Erro: {row._err}</td>
                    )}
                  </tr>
                ))}
              </tbody>
              {ok.length>1 && (
                <tfoot>
                  <tr style={{background:"#eff6ff",borderTop:"2px solid #2563eb",fontWeight:700}}>
                    <td colSpan={4} style={{padding:"8px",fontSize:12}}>TOTAL ({ok.length} invoices)</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.brl)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.iss)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.pis)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.cof)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.iof)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.cide)}</td>
                    <td style={{padding:"8px",textAlign:"right"}}>{fBRL(T.irrf)}</td>
                    <td style={{padding:"8px",textAlign:"right",color:"#1d4ed8",fontSize:13}}>{fBRL(T.tot)}</td>
                    <td style={{padding:"8px",textAlign:"right",color:"#059669"}}>{T.brl>0?fPCT(T.carga/T.brl):"--"}</td>
                    <td/>
                  </tr>
                </tfoot>
              )}
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════
function App() {
  const [tab,setTab]   = useState("calc");
  const [form,setForm] = useState({
    desc:"",moeda:"USD",val:"",cotInv:"",cotIRRF:"",
    pais:"Estados Unidos",alfISS:"2",alfIRRFOverride:"",
    cide:false,grossUp:false,parecer2026:true,_irrfM:false,
  });
  const [res,setRes] = useState(null);

  return (
    <div style={{fontFamily:"system-ui,-apple-system,sans-serif",maxWidth:1150,margin:"0 auto",padding:"0 14px 40px",background:"#f8fafc",minHeight:"100vh"}}>
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#1d4ed8)",color:"#fff",padding:"14px 20px",borderRadius:"0 0 14px 14px",marginBottom:20,boxShadow:"0 4px 12px rgba(29,78,216,.2)"}}>
        <h1 style={{margin:0,fontSize:17,fontWeight:800}}>Importacao de Servicos &mdash; Calculadora Tributaria</h1>
        <p style={{margin:"4px 0 0",fontSize:11.5,opacity:.85}}>ISSQN / PIS-Importacao / COFINS-Importacao / IRRF / IOF-Cambio / CIDE &nbsp;|&nbsp; Legislacao Brasileira Vigente</p>
      </div>
      <div style={{display:"flex",borderBottom:"2px solid #e5e7eb",marginBottom:20}}>
        {[["calc","Calculadora"],["lote","Processamento em Lote"],["guia","Guia de Uso"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{padding:"9px 22px",border:"none",background:"none",cursor:"pointer",fontSize:13,
            fontWeight:tab===k?700:500,color:tab===k?"#1d4ed8":"#6b7280",
            borderBottom:tab===k?"3px solid #1d4ed8":"3px solid transparent",marginBottom:-2}}>{l}</button>
        ))}
      </div>
      {tab==="calc" && <TabCalc form={form} setForm={setForm} res={res} setRes={setRes}/>}
      {tab==="lote" && <TabLote/>}
      {tab==="guia" && <TabGuia/>}
      <p style={{marginTop:28,textAlign:"center",fontSize:10.5,color:"#9ca3af"}}>
        Ferramenta auxiliar &mdash; consulte um contador ou advogado tributarista para casos especificos. &nbsp;|&nbsp;
        PIS 1,65% / COFINS 7,60% / IOF 3,5% / CIDE 10% / IRRF conforme pais (IN RFB 1.037/2010)
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
